<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Western States Trail Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#1E3A2F; --pine-soft:#40594C; --paper:#EFF5F1; --card:#FFFFFF;
  --poppy:#E8743B; --poppy-deep:#C85A24; --sky:#BFD9CD;
  --ok:#2F8F5B; --ok-bg:#E3F2E9; --no:#C8503C; --no-bg:#F9E8E4;
  --line:#D5E2DA; --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--pine);
  background:var(--paper);
  background-image:radial-gradient(circle at 85% 8%, #FBE9DC 0%, transparent 34%),
                   radial-gradient(circle at 8% 95%, #E2EFE8 0%, transparent 40%);
  min-height:100vh;padding:10px 12px 20px;
}
.wrap{max-width:680px;margin:0 auto}
header{text-align:center;margin-bottom:4px}
.kicker{font-weight:800;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--poppy-deep)}
h1{font-family:'Baloo 2',cursive;font-size:clamp(1.3rem,4vw,1.7rem);line-height:1.05;letter-spacing:-.01em}
.tabs{display:flex;gap:8px;justify-content:center;margin:8px 0 8px;flex-wrap:wrap}
.tab{
  font:inherit;font-weight:800;font-size:.92rem;color:var(--pine-soft);
  background:var(--card);border:2px solid var(--line);border-radius:999px;
  padding:7px 16px;cursor:pointer;transition:transform .12s,background .12s,color .12s;
}
.tab:hover{transform:translateY(-1px)}
.tab[aria-selected="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--poppy);outline-offset:2px}
.card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:0 8px 26px rgba(30,58,47,.10),0 1px 0 rgba(30,58,47,.05);
  padding:12px 16px 14px;
}
.scorebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-weight:800;font-size:.8rem}
.chip{background:var(--paper);border-radius:999px;padding:5px 13px}
.chip .n{color:var(--poppy-deep)}
.prompt{font-family:'Baloo 2',cursive;font-size:clamp(1.05rem,3.5vw,1.3rem);text-align:center;margin:2px 0 6px;min-height:1.3em}
.prompt .word{color:var(--poppy-deep)}
.mapbox{display:flex;justify-content:center}
svg#map{width:min(440px,92vw);height:auto}
.st{fill:#E7F0EA;stroke:var(--pine);stroke-width:2.5;transition:fill .15s}
.st.hl{fill:var(--poppy)}
.st.dim{opacity:.45}
.mode-find .st,.mode-find #hi-hit{cursor:pointer}
body{touch-action:manipulation}
.mode-find .st:hover{fill:var(--sky)}
.st.flash-ok{fill:var(--ok)}
.st.flash-no{fill:var(--no)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.choice{
  font:inherit;font-weight:800;font-size:1rem;color:var(--pine);
  background:var(--paper);border:2px solid var(--line);border-radius:14px;
  padding:11px 10px;cursor:pointer;transition:transform .1s,background .12s;
}
.choice:hover{transform:translateY(-1px);background:var(--sky)}
.choice.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.choice.no{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.choice:disabled{cursor:default}
.spellrow{display:flex;gap:10px;margin-top:8px}
input#spell{
  flex:1;font:inherit;font-weight:700;font-size:1.15rem;color:var(--pine);
  border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--paper);
}
.btn{
  font:inherit;font-weight:800;color:#fff;background:var(--poppy);border:none;
  border-radius:14px;padding:12px 22px;cursor:pointer;transition:transform .1s,background .12s;
}
.btn:hover{background:var(--poppy-deep);transform:translateY(-1px)}
.btn.ghost{background:var(--pine)}
.letters{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:6px;min-height:0}
.lt{
  font-family:'Baloo 2',cursive;font-weight:700;font-size:1.15rem;width:30px;height:34px;
  display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--paper);
}
.lt.ok{background:var(--ok-bg);color:var(--ok)}
.lt.no{background:var(--no-bg);color:var(--no)}
.lt.sp{background:transparent;width:12px}
.feedback{text-align:center;font-weight:800;margin-top:6px;min-height:1.2em;font-size:.92rem}
.feedback.good{color:var(--ok)} .feedback.bad{color:var(--no)}
.next-row{display:flex;justify-content:center;margin-top:8px}
.hidden{display:none !important}
.summary{text-align:center}
.summary h2{font-family:'Baloo 2',cursive;font-size:1.7rem;margin-bottom:6px}
.summary .big{font-family:'Baloo 2',cursive;font-size:3rem;color:var(--poppy-deep);line-height:1}
.missed{margin:14px auto 4px;max-width:400px;text-align:left;background:var(--paper);border-radius:14px;padding:12px 16px;font-weight:600}
.missed b{color:var(--poppy-deep)}
footer{text-align:center;margin-top:8px;font-size:.72rem;font-weight:700;color:var(--pine-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
@media (max-width:430px){.choices{grid-template-columns:1fr}}
</style>
</head>

      </div>
      <div class="choices hidden" id="choices"></div>
      <div class="spellrow hidden" id="spellrow">
        <input id="spell" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Type the capital city">
        <button class="btn" id="check">Check</button>
      </div>
      <div class="letters" id="letters"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <div class="next-row"><button class="btn ghost hidden" id="next">Next question</button></div>
    </div>

    <div id="summary" class="summary hidden">
      <h2 id="sum-title">Trail complete!</h2>
      <div class="big" id="sum-score"></div>
      <p id="sum-note" style="font-weight:700;margin-top:6px"></p>
      <div class="missed hidden" id="sum-missed"></div>
      <div class="next-row"><button class="btn" id="again">Hike it again</button></div>
    </div>
  </div>
  <footer>Round of 13 &bull; anything missed comes back at the end until it&rsquo;s right</footer>
</div>

<script>
const DATA = [
  ["Washington","Olympia"],["Oregon","Salem"],["California","Sacramento"],
  ["Nevada","Carson City"],["Idaho","Boise"],["Montana","Helena"],
  ["Wyoming","Cheyenne"],["Utah","Salt Lake City"],["Colorado","Denver"],
  ["Arizona","Phoenix"],["New Mexico","Santa Fe"],["Alaska","Juneau"],["Hawaii","Honolulu"]
];
const $ = id => document.getElementById(id);
const stateEls = {};
document.querySelectorAll(".st").forEach(el => stateEls[el.dataset.state] = el);

let mode = "find", queue = [], missed = [], score = 0, asked = 0, total = 13,
    current = null, attempts = 0, locked = false;

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function clearMap(){ Object.values(stateEls).forEach(e => e.classList.remove("hl","dim","flash-ok","flash-no")); }

function startRound(){
  queue = shuffle(DATA); missed = []; score = 0; asked = 0; total = DATA.length;
  $("summary").classList.add("hidden"); $("quiz-area").classList.remove("hidden");
  $("qtot").textContent = total; $("score").textContent = 0;
  nextQuestion();
}

function nextQuestion(){
  if(queue.length === 0){
    if(missed.length){ queue = shuffle(missed); missed = []; total += queue.length; $("qtot").textContent = total; }
    else return showSummary();
  }
  current = queue.shift(); asked++; attempts = 0; locked = false;
  $("qnum").textContent = asked;
  $("feedback").textContent = ""; $("feedback").className = "feedback";
  $("next").classList.add("hidden"); $("letters").innerHTML = "";
  clearMap();
  $("card").classList.toggle("mode-find", mode === "find");
  $("choices").classList.add("hidden"); $("spellrow").classList.add("hidden");

  const [state, capital] = current;
  if(mode === "find"){
    $("prompt").innerHTML = 'Tap <span class="word">' + state + '</span> on the map';
  } else if(mode === "capital"){
    stateEls[state].classList.add("hl");
    $("prompt").innerHTML = 'What is the capital of <span class="word">' + state + '</span>?';
    buildChoices(capital, DATA.map(d => d[1]));
  } else {
    stateEls[state].classList.add("hl");
    $("prompt").innerHTML = 'Spell the capital of <span class="word">' + state + '</span>';
    $("spellrow").classList.remove("hidden");
    $("spell").value = ""; $("spell").disabled = false; $("check").disabled = false;
    setTimeout(() => $("spell").focus(), 50);
  }
}

function buildChoices(answer, pool){
  const wrong = shuffle(pool.filter(c => c !== answer)).slice(0,3);
  const opts = shuffle([answer, ...wrong]);
  const box = $("choices"); box.innerHTML = ""; box.classList.remove("hidden");
  opts.forEach(text => {
    const b = document.createElement("button");
    b.className = "choice"; b.textContent = text;
    b.onclick = () => pickChoice(b, text === answer, answer);
    box.appendChild(b);
  });
}

function pickChoice(btn, correct, answer){
  if(locked) return; locked = true;
  document.querySelectorAll(".choice").forEach(b => {
    b.disabled = true;
    if(b.textContent === answer) b.classList.add("ok");
  });
  if(correct){ score++; $("score").textContent = score; say("Nice! " + praise(), true); }
  else { btn.classList.add("no"); missed.push(current); say("It's " + answer + " — this one will come back around.", false); }
  $("next").classList.remove("hidden"); $("next").focus();
}

function mapTap(name){
  if(mode !== "find" || locked) return; locked = true;
  const target = current[0];
  if(name === target){
    stateEls[target].classList.add("flash-ok");
    score++; $("score").textContent = score; say("Found it! " + praise(), true);
  } else {
    stateEls[name].classList.add("flash-no");
    stateEls[target].classList.add("flash-ok");
    missed.push(current);
    say("That was " + name + ". " + target + " is the green one — it'll come back around.", false);
  }
  $("next").classList.remove("hidden"); $("next").focus();
}

const norm = s => s.toLowerCase().replace(/\s+/g," ").trim();
function checkSpelling(){
  if(locked) return;
  const guess = $("spell").value; if(!norm(guess)) return;
  const answer = current[1];
  if(norm(guess) === norm(answer)){
    locked = true; score++; $("score").textContent = score;
    renderLetters(answer, answer);
    say("Perfect spelling! " + praise(), true);
    finishSpell();
  } else {
    attempts++;
    renderLetters(guess, answer);
    if(attempts >= 2){
      locked = true; missed.push(current);
      say("It's spelled " + answer + " — it'll come back around.", false);
      renderLetters(answer, answer);
      finishSpell();
    } else {
      say("Green letters are in the right spot. One more try!", false);
      $("spell").select();
    }
  }
}
function finishSpell(){
  $("spell").disabled = true; $("check").disabled = true;
  $("next").classList.remove("hidden"); $("next").focus();
}
function renderLetters(guess, answer){
  const box = $("letters"); box.innerHTML = "";
  const g = guess, a = answer;
  const len = Math.max(g.length, a.length);
  for(let i = 0; i < len; i++){
    const gc = g[i] || "", ac = a[i] || "";
    const d = document.createElement("div");
    if(ac === " " && gc === " "){ d.className = "lt sp"; box.appendChild(d); continue; }
    d.className = "lt " + (gc.toLowerCase() === ac.toLowerCase() && gc !== "" ? "ok" : "no");
    d.textContent = gc || "_";
    box.appendChild(d);
  }
}

const PRAISE = ["You're on the trail!","Summit ahead!","Map master!","Keep hiking!","Golden!","Trailblazer!"];
function praise(){ return PRAISE[Math.floor(Math.random()*PRAISE.length)]; }
function say(msg, good){
  const f = $("feedback"); f.textContent = msg;
  f.className = "feedback " + (good ? "good" : "bad");
}

function showSummary(){
  $("quiz-area").classList.add("hidden");
  $("summary").classList.remove("hidden");
  $("sum-score").textContent = score + " / " + total;
  const perfect = score === total;
  $("sum-title").textContent = perfect ? "Perfect hike!" : "Trail complete!";
  $("sum-note").textContent = perfect
    ? "Every state, first try. Ready for the real test."
    : "You got everything right by the end — a few needed extra tries.";
  $("sum-missed").classList.add("hidden");
}

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected","false"));
    t.setAttribute("aria-selected","true");
    mode = t.dataset.mode;
    startRound();
  };
});
Object.entries(stateEls).forEach(([name, el]) => {
  el.addEventListener("click", () => mapTap(name));
});
$("hi-hit").addEventListener("click", () => mapTap("Hawaii"));
$("next").onclick = nextQuestion;
$("again").onclick = startRound;
$("check").onclick = checkSpelling;
$("spell").addEventListener("keydown", e => { if(e.key === "Enter") checkSpelling(); });

startRound();
</script>
